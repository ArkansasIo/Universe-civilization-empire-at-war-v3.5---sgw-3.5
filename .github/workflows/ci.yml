name: Continuous integration

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build web app
        env:
          VITE_BASE_PATH: /Universe-civilization-empire-at-war-v3.5---sgw-3.5/
        run: npm run build

      - name: Verify built entry point and assets
        run: |
          test -s dist/index.html
          grep -q 'Universe Civilization' dist/index.html
