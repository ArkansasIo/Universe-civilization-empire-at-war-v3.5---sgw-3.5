name: Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/server/**'
      - 'scripts/engine-smoke.ts'
      - 'scripts/authoritative-engine-smoke.ts'
      - 'scripts/game-command-smoke.ts'
      - 'package.json'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'src/engine/**'
      - 'src/server/**'
      - 'scripts/engine-smoke.ts'
      - 'scripts/authoritative-engine-smoke.ts'
      - 'scripts/game-command-smoke.ts'
      - 'package.json'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run deterministic engine tests
        run: npm run engine:smoke
      - name: Run authoritative engine tests
        run: npm run authoritative:smoke
      - name: Run authenticated command tests
        run: npm run game:command:smoke
