name: Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/server/**'
      - 'src/rpg/crafting*.ts'
      - 'src/rpg/CRAFTING_UPGRADE_TESTS.md'
      - 'src/rpg/crafting-upgrade-regression.test.ts'
      - 'src/rpg/tempering.ts'
      - 'src/rpg/masterworking.ts'
      - 'src/rpg/catalog.ts'
      - 'scripts/crafting-service-smoke.ts'
      - 'scripts/crafting-http-smoke.ts'
      - 'scripts/engine-smoke.ts'
      - 'scripts/authoritative-engine-smoke.ts'
      - 'scripts/game-command-smoke.ts'
      - 'scripts/server-service-smoke.ts'
      - 'scripts/auth-smoke.ts'
      - 'scripts/http-server-smoke.ts'
      - 'package.json'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'src/engine/**'
      - 'src/server/**'
      - 'src/rpg/crafting*.ts'
      - 'src/rpg/CRAFTING_UPGRADE_TESTS.md'
      - 'src/rpg/crafting-upgrade-regression.test.ts'
      - 'src/rpg/tempering.ts'
      - 'src/rpg/masterworking.ts'
      - 'src/rpg/catalog.ts'
      - 'scripts/crafting-service-smoke.ts'
      - 'scripts/crafting-http-smoke.ts'
      - 'scripts/engine-smoke.ts'
      - 'scripts/authoritative-engine-smoke.ts'
      - 'scripts/game-command-smoke.ts'
      - 'scripts/server-service-smoke.ts'
      - 'scripts/auth-smoke.ts'
      - 'scripts/http-server-smoke.ts'
      - 'package.json'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run deterministic engine tests
        run: npm run engine:smoke
      - name: Run authoritative engine tests
        run: npm run authoritative:smoke
      - name: Run authenticated command tests
        run: npm run game:command:smoke
      - name: Run server service integration tests
        run: npm run server:service:smoke
      - name: Run authentication integration tests
        run: npm run auth:smoke
      - name: Run HTTP server integration tests
        run: npm run server:http:smoke
      - name: Run crafting service integration tests
        run: npm run crafting:service:smoke
      - name: Run crafting HTTP integration tests
        run: npm run crafting:http:smoke
      - name: Run tempering and masterworking regression tests
        run: npm run crafting:regression
