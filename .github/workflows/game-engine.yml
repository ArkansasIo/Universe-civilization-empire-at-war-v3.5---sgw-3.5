name: Game Engine Validation

on:
  push:
    branches: [main]
    paths:
      - "src/server/**"
      - "src/utils/**"
      - "scripts/engine-smoke.ts"
      - "scripts/game-command-smoke.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/game-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/server/**"
      - "src/utils/**"
      - "scripts/engine-smoke.ts"
      - "scripts/game-command-smoke.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/game-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Engine and command smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deterministic game engine
        run: npm run engine:smoke

      - name: Validate authoritative game commands
        run: npm run game:command:smoke
