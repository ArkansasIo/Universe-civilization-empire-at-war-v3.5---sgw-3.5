name: Repository Sanity Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify key files exist
        run: |
          test -s README.md
          test -s package.json
          test -s .github/workflows/pages.yml
          test -s docs/ENGINEERING_ROADMAP.md
          test -s docs/RELEASE_VERIFICATION.md
