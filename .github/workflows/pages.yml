name: Deploy Universe Civilization Empire at War SGW 3.5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static web edition
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          if [ -d web ]; then
            cp -R web/. dist/
          elif [ -f index.html ]; then
            cp index.html dist/index.html
          elif [ -f README.md ]; then
            cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Universe Civilization Empire at War — SGW 3.5</title>
            <style>
              body{margin:0;background:#070b14;color:#d9e4f2;font:16px system-ui,sans-serif}
              main{max-width:1000px;margin:8vh auto;padding:32px}
              a{color:#8fc7ff}
              .panel{border:1px solid #26364d;background:#0d1422;padding:24px;border-radius:12px}
            </style>
          </head>
          <body><main><div class="panel">
            <h1>Universe Civilization Empire at War — SGW 3.5</h1>
            <p>Static web edition and project portal.</p>
            <p>The repository contains the project source. Native/server components must run outside GitHub Pages.</p>
            <p><a href="https://github.com/ArkansasIo/Universe-civilization-empire-at-war-v3.5---sgw-3.5">View source on GitHub</a></p>
          </div></main></body>
          </html>
          EOF
          else
            echo "No web entry point found." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
