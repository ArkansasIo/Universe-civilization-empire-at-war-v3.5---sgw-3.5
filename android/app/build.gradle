plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arkansasio.universecivilization'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arkansasio.universecivilization'
        minSdk 23
        targetSdk 35
        versionCode 350
        versionName '3.5.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
