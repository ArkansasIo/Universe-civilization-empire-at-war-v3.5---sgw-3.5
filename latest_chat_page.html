cial systems. citeturn0search4\\n\\nBelow is the consolidated **feature inventory I can identify from the repository's documentation, source structure, configuration, and game-logic files**.\\n\\n# Stellar Dominion 3.5 — Complete Feature List\\n\\n## 1. Core Game\\n\\n- Persistent multiplayer galaxy\\n- 4X strategy gameplay\\n- MMO architecture\\n- Real-time game loop\\n- Resource production\\n- Construction\\n- Research\\n- Exploration\\n- Colonization\\n- Expansion\\n- Diplomacy\\n- Espionage\\n- Fleet management\\n- Fleet combat\\n- Planetary management\\n- Population management\\n- Civilization progression\\n- Missions\\n- Campaigns\\n- Events\\n- Achievements\\n- Crafting\\n- Ship fitting\\n- Technology trees\\n- Alliances\\n- PvE\\n- PvP\\n- AI-controlled entities\\n- Persistent player progression\\n\\n---\\n\\n# 2. Galaxy / Universe\\n\\n- Procedurally generated universe\\n- Galaxy map\\n- Star systems\\n- Sectors\\n- Regions\\n- Coordinates\\n- Celestial objects\\n- Stars\\n- Planets\\n- Moons\\n- Asteroid fields\\n- Debris fields\\n- Unclaimed systems\\n- Claimed systems\\n- Player-controlled systems\\n- Dynamic exploration\\n- Scanning\\n- Planet discovery\\n- Celestial-object ownership\\n- Planet takeover\\n- Planet trading\\n- Universe/realm system\\n- Realm bonuses\\n- Realm restrictions\\n- System-distance mechanics\\n- Capital distance scaling\\n\\nThe repository has a dedicated Universe System as well as a Celestial Body System covering discovery, ownership, combat, and player-driven trading. citeturn0search4\\n\\n---\\n\\n# 3. Planet System\\n\\n### Planet management\\n\\n- Planet discovery\\n- Planet claiming\\n- Planet colonization\\n- Planet occupation\\n- Planet takeover\\n- Planet ownership\\n- Planet trading\\n- Planet development\\n- Planet resources\\n- Planet population\\n- Planet buildings\\n- Planet defenses\\n- Planet production\\n- Planet management\\n- Planet command\\n- Planet detail pages\\n- Planet dossiers\\n- Planet vault\\n
